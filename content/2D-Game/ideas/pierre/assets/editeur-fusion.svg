<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 390" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse">
      <rect width="36" height="36" fill="none" stroke="#262a38" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="760" height="390" rx="14" fill="#12141c"/>
  <text x="380" y="34" fill="#e6e6ef" font-size="18" font-weight="600" text-anchor="middle">Éditeur de vaisseau : la fusion réduit la hitbox</text>

  <!-- ===== Sans fusion ===== -->
  <text x="195" y="78" fill="#e6e6ef" font-size="15" font-weight="600" text-anchor="middle">Sans fusion</text>
  <rect x="105" y="100" width="180" height="144" fill="url(#grid)"/>
  <!-- hitbox -->
  <rect x="137" y="96" width="116" height="152" rx="6" fill="#ff6b6b" fill-opacity="0.08" stroke="#ff6b6b" stroke-width="2" stroke-dasharray="6 4"/>
  <!-- canons -->
  <rect x="180" y="103" width="30" height="30" rx="5" fill="#ff6b6b"/><text x="195" y="123" fill="#12141c" font-size="13" font-weight="700" text-anchor="middle">C</text>
  <rect x="144" y="139" width="30" height="30" rx="5" fill="#ff6b6b"/><text x="159" y="159" fill="#12141c" font-size="13" font-weight="700" text-anchor="middle">C</text>
  <rect x="216" y="139" width="30" height="30" rx="5" fill="#ff6b6b"/><text x="231" y="159" fill="#12141c" font-size="13" font-weight="700" text-anchor="middle">C</text>
  <!-- noyau -->
  <rect x="180" y="139" width="30" height="66" rx="5" fill="#7aa2f7"/><text x="195" y="177" fill="#12141c" font-size="13" font-weight="700" text-anchor="middle">N</text>
  <!-- booster -->
  <rect x="180" y="211" width="30" height="30" rx="5" fill="#e0af68"/><text x="195" y="231" fill="#12141c" font-size="13" font-weight="700" text-anchor="middle">D</text>
  <text x="195" y="282" fill="#e6e6ef" font-size="13" text-anchor="middle">Dégâts : 3 canons × 10 = 30</text>
  <text x="195" y="302" fill="#ff6b6b" font-size="13" font-weight="600" text-anchor="middle">Hitbox : 3 × 4 = 12 cases</text>

  <!-- flèche -->
  <line x1="330" y1="172" x2="420" y2="172" stroke="#b4b8cc" stroke-width="2"/>
  <polygon points="420,165 434,172 420,179" fill="#b4b8cc"/>
  <text x="380" y="160" fill="#b4b8cc" font-size="13" text-anchor="middle">fusion</text>
  <text x="380" y="194" fill="#b4b8cc" font-size="11" text-anchor="middle">3 C → C×3</text>

  <!-- ===== Avec fusion ===== -->
  <text x="575" y="78" fill="#e6e6ef" font-size="15" font-weight="600" text-anchor="middle">Avec fusion</text>
  <rect x="485" y="100" width="180" height="144" fill="url(#grid)"/>
  <rect x="553" y="96" width="44" height="152" rx="6" fill="#9ece6a" fill-opacity="0.08" stroke="#9ece6a" stroke-width="2" stroke-dasharray="6 4"/>
  <rect x="560" y="103" width="30" height="30" rx="5" fill="#ff6b6b"/><text x="575" y="122" fill="#12141c" font-size="11" font-weight="700" text-anchor="middle">C×3</text>
  <rect x="560" y="139" width="30" height="66" rx="5" fill="#7aa2f7"/><text x="575" y="177" fill="#12141c" font-size="13" font-weight="700" text-anchor="middle">N</text>
  <rect x="560" y="211" width="30" height="30" rx="5" fill="#e0af68"/><text x="575" y="231" fill="#12141c" font-size="13" font-weight="700" text-anchor="middle">D</text>
  <text x="575" y="282" fill="#e6e6ef" font-size="13" text-anchor="middle">Dégâts : C×3 = 30 (stats additionnées)</text>
  <text x="575" y="302" fill="#9ece6a" font-size="13" font-weight="600" text-anchor="middle">Hitbox : 1 × 4 = 4 cases</text>

  <!-- légende -->
  <rect x="150" y="340" width="14" height="14" rx="3" fill="#7aa2f7"/><text x="170" y="352" fill="#b4b8cc" font-size="12">N = noyau (base du vaisseau)</text>
  <rect x="360" y="340" width="14" height="14" rx="3" fill="#ff6b6b"/><text x="380" y="352" fill="#b4b8cc" font-size="12">C = canon</text>
  <rect x="470" y="340" width="14" height="14" rx="3" fill="#e0af68"/><text x="490" y="352" fill="#b4b8cc" font-size="12">D = booster de dash</text>
  <text x="380" y="376" fill="#b4b8cc" font-size="11" text-anchor="middle">Pointillés = hitbox. Chaque pièce posée agrandit la zone où l'on peut être touché.</text>
</svg>
